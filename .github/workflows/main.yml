name: Build and test DevOps Group 8

on:
  push:
  pull_request:

jobs:
  build:
    name: Build Maven JAR and Docker image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode clean package

      - name: Build Docker image
        run: docker build -t devops-group8:ci .
