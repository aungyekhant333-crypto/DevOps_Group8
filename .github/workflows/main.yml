name: Build and run DevOps Group 8

on:
  push:
  pull_request:

jobs:
  build-and-run:
    name: Build and run application with Docker
    runs-on: ubuntu-24.04

    env:
      DB_PASSWORD: ci-only-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build executable JAR
        run: mvn --batch-mode clean package

      - name: Start database and run application
        run: docker compose up --build --abort-on-container-exit --exit-code-from app

      - name: Stop containers and clean up database
        if: always()
        run: docker compose down --volumes --remove-orphans
