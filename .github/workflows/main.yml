name: Build and Test DevOps Group 8

on:
  push:
  pull_request:

jobs:
  build:
    name: Build Maven JAR and Docker Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Build Docker Image
        run: docker build -t devops-group8-app .

      - name: Start database and application
        env:
          DB_PASSWORD: github-actions-password
        run: docker compose up --build -d database app

      - name: Wait for application
        run: sleep 10

      - name: View application logs
        run: docker compose logs app

      - name: Check application completed successfully
        run: |
          if docker compose ps --status=exited app | grep -q "app"; then
            echo "Application container completed."
          else
            echo "Application container did not complete."
            exit 1
          fi

      - name: Stop containers
        if: always()
        run: docker compose down -v