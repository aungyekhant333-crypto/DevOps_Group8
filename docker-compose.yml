services:
  database:
    image: mariadb:11.7
    container_name: devops-group8-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: world
    ports:
      - "3307:3306"
    volumes:
      - world-db-data:/var/lib/mysql
      - ./docker/mysql/init/world.sql:/docker-entrypoint-initdb.d/world.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: devops-group8-app
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mariadb://database:3306/world
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}

volumes:
  world-db-data: